[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chart2data-dataset"
version = "0.1.0"
description = "Synthetic chart-image datasets with canonical data- and pixel-space truth"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Chart2Data contributors"}]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pillow>=10",
  "pyarrow>=14",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
plotly = ["plotly>=6.1.1", "kaleido>=1.0.0"]

[project.scripts]
chart2data = "chart2data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chart2data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
